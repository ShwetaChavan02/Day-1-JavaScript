<!DOCTYPE html>
<html>
    <head>
        <title>Cart Quantity</title>
    </head>
    <body>

        <button onclick="document.getElementById('paragraph').innerHTML='Items in your cart =' + CartQuantity;">Show</button>
        <button onclick="CartQuantity = CartQuantity + 1">Add to Cart</button>
        <button onclick="CartQuantity = CartQuantity + 2">+2</button>
        <button onclick="CartQuantity = CartQuantity + 3">+3</button>
        <button onclick="CartQuantity = 0">Clear Cart</button>
        <p id = "paragraph"></p>
        

        <script>
            let CartQuantity = 0;
        </script>
    </body>
</html>
